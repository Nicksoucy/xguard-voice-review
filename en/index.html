<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XGuard Academy — English Review</title>
<link rel="stylesheet" href="en.css?v=eafc134">
</head>
<body>
<!--
  Edition anglaise de l'app de revision (2026-11-04). Page SEPAREE du cockpit francais :
  elle ne montre que les cours <id>-en (filtre XG.filtrerLangue de lib/app-config.js, actif
  parce que la page vit sous /en/), et le cockpit francais ne les montre jamais.
  Reviseuse prevue : Rachelle (anglophone). Tout le texte affiche est en anglais.

  2026-11-12 : memes 5 onglets que le cockpit francais (Audio review, Video review,
  Production, Finished courses, GHL import), lus dans les memes colonnes
  (lesson_status_full.pipeline_stage, course_lms_status). Un onglet vide le dit, avec la
  raison et ce qui le remplira : au 11-12, aucune video anglaise n'existe encore (la video
  se fabrique apres l'approbation de la voix). L'onglet GHL est en lecture seule : le
  dossier de livraison anglais se prepare avec package-ghl, en session.
-->
<h1>XGuard Academy — English Review</h1>
<div class="sub" id="subtitle">English edition of the online health and safety courses</div>

<div class="who">
  <label for="rn" class="help">Your name:</label>
  <input id="rn" placeholder="e.g. Rachelle" autocomplete="name">
  <button class="btn ghost" onclick="saveName()">Save</button>
  <span class="help" id="who-msg"></span>
</div>

<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"><div class="empty">Loading…</div></div>

<template id="aide-audio">
<div class="card help">
  <h2 style="color:#F0F0F0">How to review a lesson</h2>
  <ul>
    <li>Open a lesson and listen to it from start to finish. The text follows the voice.</li>
    <li>Click any word that sounds wrong. Choose whether it is mispronounced or the wrong word. In the box, type how it should sound (for example: wair-house) or the right word, then click Fix.</li>
    <li>If a whole sentence reads badly, click the pencil at the end of it and type the sentence you would like to hear. If the wording is fine but the voice says it badly, choose “Redo it”.</li>
    <li>Press the Glitch button (or the G key) if the voice stutters or cuts out, then click “Redo this sentence”.</li>
    <li>When the lesson sounds right, click Approve lesson. Your work saves automatically as you go. If your internet drops, your notes stay on this computer and are sent when you come back.</li>
  </ul>
  <p style="margin-top:8px">A fix robot applies your fixes and redoes the voice, usually within a few minutes (it waits until you have not sent anything for 3 minutes). The sentences it redid turn green: listen to them again, then click “Sounds right now”. A few changes, such as a change to a number, are checked by the team first; the lesson tells you when that happens.</p>
</div>
</template>

<script src="https://js.sentry-cdn.com/ab9916085bc6c9e93779c21fad74456f.min.js" crossorigin="anonymous"></script>
<script src="../sentry-init.js?v=eafc134"></script>
<script src="../lib/app-config.js?v=eafc134"></script>
<script src="../lib/net.js?v=eafc134"></script>
<script>
var XG = window.XG;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function jour(iso){ var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-CA', { month: 'long', day: 'numeric' }); }

var rnInput = document.getElementById('rn');
try { rnInput.value = localStorage.getItem('rn') || ''; } catch (e) { console.warn('localStorage unavailable', e); }
function saveName(){
  var v = rnInput.value.trim();
  if (!v) { document.getElementById('who-msg').textContent = 'Please type your name.'; return; }
  try { localStorage.setItem('rn', v); } catch (e) { console.warn('localStorage unavailable', e); }
  document.getElementById('who-msg').textContent = 'Saved. Your reviews will be signed ' + v + '.';
}

// ── Onglets (memes que le cockpit francais) ───────────────────────────
var TABS = [
  { id: 'audio', emoji: '🎙️', label: 'Audio review', sub: 'Listen to the voices and point out what sounds wrong' },
  { id: 'video', emoji: '🎬', label: 'Video review', sub: 'Watch the finished videos, then approve them or send them back' },
  { id: 'prod',  emoji: '🛠️', label: 'Production', sub: 'Where each course stands, and what happens next' },
  { id: 'done',  emoji: '✅', label: 'Finished courses', sub: 'Courses whose voices and videos are all approved' },
  { id: 'ghl',   emoji: '🚀', label: 'GHL import', sub: 'Finished courses, ready to go into GoHighLevel' },
];
// Etapes de lesson_status_full.pipeline_stage, comme le cockpit francais (cockpit.js).
var ETAPES = {
  voice_review: 'Voice to review', voice_recheck: 'Voice redone — listen again',
  video_production: 'Video being made', video_review: 'Video to watch', video_redo: 'Video being remade', done: 'Ready',
};
function ongletCourant(){
  var h = (location.hash || '').slice(1);
  if (TABS.some(function(t){ return t.id === h; })) return h;
  try { var t = localStorage.getItem('en-tab'); if (TABS.some(function(x){ return x.id === t; })) return t; } catch (e) { console.warn('localStorage unavailable', e); }
  return 'audio';
}
function choisir(id){
  try { localStorage.setItem('en-tab', id); } catch (e) { console.warn('localStorage unavailable', e); }
  history.replaceState(null, '', '#' + id);
  rendre();
}

var DATA = null;

// Etat d'une lecon, du point de vue de la reviseuse anglaise.
// « Listen again » passe AVANT « Approved » : la voix a ete refaite apres sa revue
// (status needs_recheck de la vue lesson_status_full), son approbation ne vaut plus.
function etat(l){
  if (!l.voiceover_uploaded_at) return { cls:'wait', txt:'Voice not ready' };
  if (l.status === 'needs_recheck') return { cls:'recheck', txt:'Listen again' };
  if (l.latest_approved) return { cls:'ok', txt:'Approved' };
  if ((l.flags_count || 0) + (l.glitches_count || 0) > 0) return { cls:'flags', txt:(l.flags_count||0) + (l.glitches_count||0) + ' note(s)' };
  if (l.latest_review_at) return { cls:'todo', txt:'In progress' };
  return { cls:'todo', txt:'To review' };
}
function parCours(){
  var m = {};
  DATA.lessons.forEach(function(l){ (m[l.course_id] = m[l.course_id] || []).push(l); });
  return m;
}
function compte(ls, etapes){ return ls.filter(function(l){ return etapes.indexOf(l.pipeline_stage) !== -1; }).length; }
function finis(){
  var pc = parCours();
  return DATA.courses.filter(function(c){ var ls = pc[c.id] || []; return ls.length && compte(ls, ['done']) === ls.length; });
}
function vide(titre, texte){ return '<div class="card allgood"><h2>' + titre + '</h2><p class="help">' + texte + '</p></div>'; }

function rendre(){
  if (!DATA) return;
  var t = ongletCourant();
  var L = DATA.lessons, pc = parCours();
  var nb = {
    audio: compte(L, ['voice_review', 'voice_recheck']),
    video: L.filter(aRegarder).length,
    prod: compte(L, ['video_production', 'video_redo']),
    done: finis().length,
    ghl: finis().length,
  };
  document.getElementById('tabs').innerHTML = TABS.map(function(tb){
    return '<button role="tab" aria-selected="' + (tb.id === t) + '" class="' + (tb.id === t ? 'on' : '') + '" onclick="choisir(\'' + tb.id + '\')">'
      + tb.emoji + ' ' + esc(tb.label) + '<span class="tcount' + (nb[tb.id] ? '' : ' zero') + '">' + nb[tb.id] + '</span></button>';
  }).join('');
  document.getElementById('subtitle').textContent = TABS.filter(function(x){ return x.id === t; })[0].sub;
  var v = document.getElementById('view');
  if (t === 'audio') v.innerHTML = rendreAudio(pc);
  else if (t === 'video') v.innerHTML = rendreVideo(pc);
  else if (t === 'prod') v.innerHTML = rendreProduction(pc);
  else if (t === 'done') v.innerHTML = rendreFinis(pc);
  else v.innerHTML = rendreGhl();
}

// ── Audio review ─────────────────────────────────────────────────────
function rendreAudio(pc){
  var titres = {};
  DATA.courses.forEach(function(c){ titres[c.id] = c.short_title || c.title; });
  var aReecouter = DATA.lessons.filter(function(l){ return l.voiceover_uploaded_at && l.status === 'needs_recheck'; });
  var html = document.getElementById('aide-audio').innerHTML;
  html += '<div id="recheck">' + (aReecouter.length
    ? '<div class="card recheck-card"><h2>Listen again (' + aReecouter.length + ')</h2>'
      + '<p class="help">The team redid the voice of these lessons after your review. Please listen to them again.</p>'
      + aReecouter.map(function(l){
        return '<a class="row" href="review.html?key=' + encodeURIComponent(l.lesson_key) + '"><span class="t">' + esc(l.title)
          + ' <span class="counts">· ' + esc(titres[l.course_id] || l.course_id) + ', module ' + esc(l.module_index) + '</span></span>'
          + '<span class="chip recheck">Listen again</span></a>';
      }).join('') + '</div>'
    : '') + '</div>';
  html += '<div id="courses">' + DATA.courses.map(function(c, ci){
    var ls = pc[c.id] || [];
    var ok = ls.filter(function(l){ return l.latest_approved; }).length;
    var pret = ls.filter(function(l){ return l.voiceover_uploaded_at; }).length;
    var mods = {};
    ls.forEach(function(l){ (mods[l.module_id] = mods[l.module_id] || []).push(l); });
    var corps = Object.keys(mods).sort().map(function(m){
      var ml = mods[m];
      return '<div class="mod"><h3>Module ' + esc(ml[0].module_index) + '</h3>' + ml.map(function(l){
        var e = etat(l);
        var lien = l.voiceover_uploaded_at ? ' href="review.html?key=' + encodeURIComponent(l.lesson_key) + '"' : '';
        return '<a class="row"' + lien + '><span class="t">' + esc(l.title) + '</span><span class="chip ' + e.cls + '">' + e.txt + '</span></a>';
      }).join('') + '</div>';
    }).join('');
    return '<div class="card"><div class="course-title" onclick="this.parentNode.querySelector(\'.corps\').hidden=!this.parentNode.querySelector(\'.corps\').hidden">'
      + '<span>' + esc(c.title) + '</span><span class="counts">' + ok + ' / ' + ls.length + ' approved</span></div>'
      + '<div class="bar"><i style="width:' + (ls.length ? Math.round(100 * ok / ls.length) : 0) + '%"></i></div>'
      + '<div class="counts">' + pret + ' of ' + ls.length + ' voices ready to review</div>'
      + '<div class="corps"' + (ci > 0 ? ' hidden' : '') + '>' + corps + '</div></div>';
  }).join('') + '</div>';
  return html;
}

// ── Video review ─────────────────────────────────────────────────────
// A regarder : etape video_review, PLUS une video deja produite dont la voix est encore en
// revision (la video pilote du 2026-11-12, cariste-en m00-l01) : on peut la regarder, la
// page video previent que la voix peut encore changer.
function aRegarder(l){
  if (l.pipeline_stage === 'video_review') return true;
  return !!l.has_video && /^voice_/.test(l.pipeline_stage || '') && !l.video_approved && !l.video_rejected;
}
function rendreVideo(pc){
  var parC = DATA.courses.map(function(c){
    return { c: c, ls: (pc[c.id] || []).filter(aRegarder) };
  }).filter(function(x){ return x.ls.length; });
  if (!parC.length) {
    var voixOk = compte(DATA.lessons, ['video_production', 'video_review', 'video_redo', 'done']);
    return vide('No video to watch yet',
      'Each English video is made after the voice of its lesson is approved. So far, ' + voixOk + ' of ' + DATA.lessons.length
      + ' English voices are approved, and no English video exists yet. When a video is ready, it appears here.');
  }
  return parC.map(function(x){
    return '<div class="card"><div class="course-title"><span>' + esc(x.c.title) + '</span><span class="counts">' + x.ls.length + ' to watch</span></div>'
      + x.ls.map(function(l){
        var avance = l.pipeline_stage !== 'video_review';
        return '<a class="row" href="review-video.html?key=' + encodeURIComponent(l.lesson_key) + '"><span class="t">Module ' + esc(l.module_index) + ' · ' + esc(l.title)
          + (avance ? ' <span class="counts">· voice not approved yet</span>' : '') + '</span><span class="chip todo">Watch</span></a>';
      }).join('') + '</div>';
  }).join('');
}

// ── Production ───────────────────────────────────────────────────────
function rendreProduction(pc){
  var html = '<div class="card help"><p>Every lesson goes through the same steps: the voice is reviewed and approved, then the video is made, watched and approved. A course is finished when all its lessons are. The English videos are not produced yet: they start once voices are approved.</p></div>';
  html += DATA.courses.map(function(c){
    var ls = pc[c.id] || [];
    var parEtape = {};
    ls.forEach(function(l){ parEtape[l.pipeline_stage] = (parEtape[l.pipeline_stage] || 0) + 1; });
    var lignes = Object.keys(ETAPES).filter(function(k){ return parEtape[k]; }).map(function(k){
      return '<div class="row"><span class="t">' + esc(ETAPES[k]) + '</span><span class="counts">' + parEtape[k] + ' lesson' + (parEtape[k] > 1 ? 's' : '') + '</span></div>';
    }).join('');
    var voixOk = compte(ls, ['video_production', 'video_review', 'video_redo', 'done']);
    var prochaine = voixOk < ls.length
      ? 'Next step: voice review (' + (ls.length - voixOk) + ' lesson' + (ls.length - voixOk > 1 ? 's' : '') + ' left).'
      : compte(ls, ['done']) < ls.length ? 'Next step: the videos.' : 'Finished.';
    return '<div class="card"><div class="course-title"><span>' + esc(c.title) + '</span><span class="counts">' + ls.length + ' lessons</span></div>'
      + '<div class="bar"><i style="width:' + (ls.length ? Math.round(100 * compte(ls, ['done']) / ls.length) : 0) + '%"></i></div>'
      + lignes + '<div class="counts" style="margin-top:6px">' + esc(prochaine) + '</div></div>';
  }).join('');
  return html;
}

// ── Finished courses ─────────────────────────────────────────────────
function rendreFinis(pc){
  var f = finis();
  if (!f.length) {
    return vide('No finished English course yet',
      'A course is finished when every lesson has an approved voice and an approved video. Today, no English course has its videos yet.');
  }
  return f.map(function(c){
    return '<div class="card"><div class="course-title"><span>' + esc(c.title) + '</span><span class="chip ok">✅ Finished</span></div>'
      + '<div class="counts">' + (pc[c.id] || []).length + ' lessons ready</div></div>';
  }).join('');
}

// ── GHL import (lecture seule) ───────────────────────────────────────
function rendreGhl(){
  var f = finis();
  if (!f.length) {
    return vide('Nothing to import yet',
      'Finished English courses appear here, with their import status in GoHighLevel. The delivery folder for each one is prepared by the production team.');
  }
  var lms = {};
  DATA.lms.forEach(function(r){ lms[r.course_id] = r; });
  return f.map(function(c){
    var r = lms[c.id];
    var st = !r ? 'Not exported yet' : r.live_at ? 'Live since ' + jour(r.live_at) : r.imported_at ? 'Imported on ' + jour(r.imported_at) : r.exported_at ? 'Exported on ' + jour(r.exported_at) + ', to upload' : 'Not exported yet';
    return '<div class="card"><div class="course-title"><span>' + esc(c.title) + '</span><span class="counts">' + esc(st) + '</span></div></div>';
  }).join('');
}

Promise.all([
  XG.api('courses?visible=eq.true&order=sort_order.asc,id.asc&select=id,title,short_title,lesson_count'),
  XG.apiAll('lesson_status_full?course_id=like.*-en&select=lesson_key,course_id,module_id,module_index,lesson_index,sort_order,title,status,pipeline_stage,has_video,video_approved,video_rejected,voiceover_uploaded_at,latest_approved,latest_reviewer,latest_review_at,flags_count,glitches_count&order=sort_order.asc,lesson_key.asc'),
  XG.api('course_lms_status?target=eq.ghl&course_id=like.*-en&select=course_id,status,exported_at,imported_at,live_at').catch(function(e){ XGNet.signaler(e, 'en accueil lms'); return []; }),
]).then(function(res){
  DATA = { courses: res[0] || [], lessons: res[1] || [], lms: res[2] || [] };
  if (!DATA.courses.length) { document.getElementById('view').innerHTML = '<div class="empty">No English course yet.</div>'; return; }
  rendre();
}).catch(function(e){
  // Bandeau rouge persistant de lib/net.js : « Try again » recharge la page.
  XGNet.signaler(e, 'en accueil chargement');
  var m = /HTTP (\d+)/.exec(e.message || '');
  XGNet.afficherErreur('accueil', XGNet.messageErreur('load the courses', { status: m ? +m[1] : 0 }, 'en'));
  document.getElementById('view').innerHTML = '<div class="empty">The courses could not be loaded. Use Try again at the top of the page.</div>';
});
window.addEventListener('hashchange', rendre);
</script>
</body>
</html>
