# CI : lint JS + HTML + tests unitaires (vitest) sur PR vers gh-pages
#
# Bloque le merge si syntax error, problemes critiques, ou tests rouges.
# La logique metier pure vit dans lib/*-logic.js (export double navigateur/Node) et est
# couverte par vitest (tests/unit/). Voir README section « Tests ».
#
# Triggers :
# - PR vers gh-pages → run lint + tests, bloque merge si fail
# - Push direct sur gh-pages / feature/** → idem

name: CI - Lint + Tests

on:
  pull_request:
    branches:
      - gh-pages
  push:
    branches:
      - gh-pages
      - 'feature/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ESLint + HTMLHint
        run: |
          npm install --no-save \
            eslint@8 \
            htmlhint@1

      - name: Run ESLint on .js files (BLOQUANT sur erreur)
        run: |
          npx eslint --no-eslintrc --config .eslintrc.json \
            *.js lib/*.js review/*.js lms/*.js scripts/*.mjs

      - name: Run HTMLHint on .html files
        run: |
          npx htmlhint --config .htmlhintrc *.html

      - name: Verify Sentry script tag present
        run: |
          # Garde-fou : tous les .html principaux doivent avoir le loader Sentry
          for f in index.html course.html review.html review-video.html analytics.html; do
            if [ -f "$f" ] && ! grep -q "js.sentry-cdn.com" "$f"; then
              echo "::error file=$f::Sentry loader script manquant dans $f"
              exit 1
            fi
          done
          echo "✓ Tous les HTML principaux ont le Sentry loader"

      - name: Verify backup script syntax
        run: |
          node --check scripts/backup-rest.mjs
          echo "✓ backup-rest.mjs syntax OK"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run unit tests (vitest) — BLOQUANT
        run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E + a11y tests (Supabase simule) — BLOQUANT
        run: npm run test:e2e
