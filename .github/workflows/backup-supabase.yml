# Backup quotidien des tables critiques via Supabase REST API
#
# Trigger : 04:00 UTC (00:00 EST) chaque jour, ou manuel via UI
# Pas besoin de secret — utilise la SUPA_ANON key (deja publique dans review.js)
#
# Output : 1 release par jour, tag `backup-YYYY-MM-DD`, asset .json.gz par table
# Retention : releases auto-deleted apres 30 jours
#
# Limite Option B : exports les DONNEES uniquement (pas le schema, pas les RLS,
# pas les triggers). Pour un dump complet avec schema, utiliser Option A
# (pg_dump avec SUPABASE_DB_URL secret) — voir RUNBOOK.md.
#
# Restoration : voir RUNBOOK.md section "Restore from Option B backup"

name: Backup Supabase (REST API)

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC tous les jours
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backup script
        run: |
          node scripts/backup-rest.mjs
          echo "BACKUP_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Verify backup files
        run: |
          ls -lh backups/
          # Le repertoire backups/ doit contenir au moins 5 fichiers
          COUNT=$(ls backups/ | wc -l)
          if [ "$COUNT" -lt 5 ]; then
            echo "ERROR: Only $COUNT backup files, expected 5+"
            exit 1
          fi
          echo "✓ $COUNT backup files generated"

      - name: Create GitHub Release with backups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "backup-${BACKUP_DATE}" backups/*.json.gz \
            --prerelease \
            --notes "Auto backup ${BACKUP_DATE} (REST API export). Restore: see RUNBOOK.md" \
            --title "Backup ${BACKUP_DATE}"
          echo "✓ Release backup-${BACKUP_DATE} created"

      - name: Cleanup old backups (>30 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y-%m-%d)
          gh release list --limit 100 --json tagName,createdAt | \
            jq -r '.[] | select(.tagName | startswith("backup-")) | .tagName' | \
            while read tag; do
              tag_date=${tag#backup-}
              if [[ "$tag_date" < "$CUTOFF" ]]; then
                echo "Deleting old backup: $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              fi
            done

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backup failed for ${BACKUP_DATE:-unknown}. Check logs above."
