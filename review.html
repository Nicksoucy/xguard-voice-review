<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Review</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0A0E1A;color:#F0F0F0;padding:20px 24px;min-height:100vh;max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
h1{color:#E74C3C;font-size:14px}
.nav{display:flex;gap:6px;align-items:center}
.nav a,.nav span{color:#94A3B8;font-size:12px;text-decoration:none;padding:5px 12px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}
.nav a:hover{background:rgba(255,255,255,0.12);color:#fff}
.nav .cur{color:#E74C3C}

.recheck-banner{background:rgba(231,76,60,0.14);border-left:4px solid #E74C3C;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:12px;font-size:12px;color:#F8CACE;line-height:1.6}
.recheck-banner strong{color:#fff;font-size:13px}
.recheck-banner.hidden{display:none}
.approved-banner{background:rgba(39,174,96,0.14);border-left:4px solid #27AE60;padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:12px;font-size:12px;color:#B9E8CB;line-height:1.6}
.approved-banner strong{color:#fff;font-size:13px}
.approved-banner.hidden{display:none}

.player{background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pb{background:#C0392B;color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pb:hover{background:#E74C3C}
.pbar{flex:1;min-width:150px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;cursor:pointer}
.pfill{height:100%;background:#C0392B;border-radius:3px;width:0%;pointer-events:none}
.tm{color:#94A3B8;font-size:11px;font-family:monospace;min-width:80px;text-align:right}
.spd{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#aaa;border-radius:4px;padding:3px 7px;font-size:11px;cursor:pointer}
.spd.on{background:#C0392B;border-color:#C0392B;color:#fff}
.stb{background:#E67E22;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer}
.stb:hover{background:#F39C12}.stb.flash{background:#27AE60}

.wc{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px 14px;line-height:1.8;min-height:80px;max-height:60vh;overflow-y:auto}
.w{display:inline;padding:1px 1px;border-radius:2px;cursor:pointer;font-size:11px;color:#444;transition:color .08s}
.w.spoken{color:#999}.w.now{color:#fff;background:rgba(255,255,255,0.08);font-weight:600}
.w.flagged{color:#E74C3C;border-bottom:2px solid #E74C3C;font-weight:600}
.w.flagged.now{background:rgba(231,76,60,0.3)}.w:hover{background:rgba(255,255,255,0.05)}
.sm{display:inline-block;color:#333;font-size:9px;font-family:monospace;vertical-align:super;margin:0 2px;user-select:none}

.fp{background:rgba(231,76,60,0.06);border:1px solid rgba(231,76,60,0.15);border-radius:8px;padding:14px 18px;margin-top:12px}
.sec{font-size:13px;font-weight:600;margin-bottom:8px}
.sec.o{color:#E67E22}.sec.r{color:#E74C3C}
.ri{display:flex;align-items:center;gap:6px;margin-bottom:5px;padding:5px 8px;border-radius:5px;flex-wrap:wrap;font-size:12px}
.ri.g{background:rgba(230,126,34,0.08);border:1px solid rgba(230,126,34,0.2)}
.ri.f{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
.ri .rt{color:#666;min-width:32px;cursor:pointer}
.ri .rs{color:#E67E22;font-family:monospace;min-width:24px;font-size:11px}
.ri .rw{color:#E74C3C;font-weight:600;min-width:80px}
.ri .rc{color:#777;flex:1;min-width:120px}
.ri input{max-width:180px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:4px;padding:3px 7px;color:#F0F0F0;font-size:11px;font-family:inherit}
.ri input::placeholder{color:#555}
.ri .rm{background:none;border:none;color:#666;font-size:14px;cursor:pointer;padding:2px 5px}
.ri .rm:hover{color:#E74C3C}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer}
.br{background:#C0392B;color:#fff}.br:hover{background:#E74C3C}
.bg{background:#27AE60;color:#fff}.bg:hover{background:#2ECC71}
.by{background:rgba(255,255,255,0.08);color:#aaa;border:1px solid rgba(255,255,255,0.12)}.by:hover{background:rgba(255,255,255,0.15)}
.msg{color:#27AE60;font-size:12px;margin-left:4px}
.empty{color:#555;font-style:italic;font-size:13px;padding:6px}
.err{color:#E74C3C;padding:20px;background:rgba(231,76,60,0.08);border-left:3px solid #E74C3C;border-radius:0 8px 8px 0;font-size:13px}
</style></head><body>
<div class="top">
  <h1 id="title">Chargement...</h1>
  <div class="nav" id="nav"></div>
</div>

<div id="recheck-banner" class="recheck-banner hidden"></div>
<div id="approved-banner" class="approved-banner hidden"></div>

<div class="player">
  <button class="pb" id="bp" onclick="tg()">&#9654;</button>
  <div class="pbar" id="pbar" onmousedown="seek(event)"><div class="pfill" id="pfill"></div></div>
  <span class="tm" id="ti">0:00</span>
  <button class="spd on" onclick="setSpd(1,this)">1x</button>
  <button class="spd" onclick="setSpd(.75,this)">.75x</button>
  <button class="spd" onclick="setSpd(.5,this)">.5x</button>
  <button class="stb" id="stb" onclick="flagStutter()">&#9889; Stutter</button>
</div>

<div class="wc" id="wc"><div style="color:#94A3B8;text-align:center;padding:30px">Chargement...</div></div>

<div class="fp">
  <div class="sec o">&#9889; Stutters / Glitches</div>
  <div id="gl"><div class="empty">Appuie &#9889; Stutter pendant l'écoute</div></div>
  <div style="height:10px"></div>
  <div class="sec r">&#128308; Mots mal prononcés</div>
  <div id="fl"><div class="empty">Clique sur les mots qui sonnent mal</div></div>
  <div class="acts">
    <button class="btn br" onclick="saveReview(false)">Sauvegarder</button>
    <button class="btn bg" onclick="saveReview(true)">&#10003; Approuver</button>
    <button class="btn by" onclick="copyReview()">Copier texte</button>
    <span class="msg" id="msg"></span>
  </div>
</div>

<script>
var SUPA_URL = 'https://ctjsdpfegpsfpwjgusyi.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0anNkcGZlZ3BzZnB3amd1c3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDU2NDQsImV4cCI6MjA4OTE4MTY0NH0.Uv2pbxbmvcbXhyDa7Y_M0HqkLuV7uJaNxl1N01q5wMo';
var STORAGE = SUPA_URL + '/storage/v1/object/public/voiceovers';
var API = SUPA_URL + '/rest/v1';
var H = {apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};

var params = new URLSearchParams(location.search);
var lessonKey = params.get('key') || '';
var legacyIdx = params.get('lesson');  // compat retro

// Etat global
var L = null;            // lesson object
var W = [];              // timestamps
var els = [];            // word DOM elements
var flags = new Map();
var glitches = [];
var prevIdx = -1;
var au = null;

function getCtx(i){var s=Math.max(0,i-4),e=Math.min(W.length-1,i+4);var r=[];for(var k=s;k<=e;k++){r.push(k===i?'**'+W[k].word+'**':W[k].word)}return r.join(' ')}
function gsi(i){return W[i] && W[i].sentenceIndex!=null ? W[i].sentenceIndex : '?'}
function fmt(s){return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}
function fmtDate(iso){try{return new Date(iso).toLocaleString('fr-CA',{dateStyle:'medium',timeStyle:'short'})}catch(e){return iso}}

// ── Resolution lesson_key (compat retro avec ?lesson=N) ────────
function resolveLesson(cb){
  if (lessonKey) {
    // Fetch la lesson par lesson_key
    fetch(API+'/lessons?lesson_key=eq.'+encodeURIComponent(lessonKey)+'&select=*',{headers:H})
      .then(function(r){return r.json()})
      .then(function(rows){ cb(rows[0] || null) });
    return;
  }
  if (legacyIdx !== null && /^\d+$/.test(legacyIdx)) {
    // Compat retro : lecture par index (via sort par course sort_order puis lesson sort_order)
    fetch(API+'/lesson_status?select=lesson_key&order=course_id.asc,sort_order.asc',{headers:H})
      .then(function(r){return r.json()})
      .then(function(rows){
        var idx = parseInt(legacyIdx,10);
        if (idx >= 0 && idx < rows.length) {
          lessonKey = rows[idx].lesson_key;
          resolveLesson(cb);
        } else cb(null);
      });
    return;
  }
  cb(null);
}

// ── Charger l'historique de review pour cette reviewer ────────
function loadExistingReview(){
  var rn = (localStorage.getItem('rn') || 'Anonyme').trim();
  fetch(API+'/voice_reviews?lesson_key=eq.'+encodeURIComponent(L.lesson_key)+'&reviewer_name=eq.'+encodeURIComponent(rn)+'&select=*',{headers:H})
    .then(function(r){return r.json()})
    .then(function(rows){
      if (!rows.length) return;
      var rev = rows[0];
      // Restaurer les flags
      if (Array.isArray(rev.flags)) {
        rev.flags.forEach(function(f){
          flags.set(f.index, f);
          if (els[f.index]) els[f.index].classList.add('flagged');
        });
      }
      if (Array.isArray(rev.glitches)) {
        glitches = rev.glitches.slice();
      }
      renderFlags();
      renderGlitches();
    });
}

// ── Charger le status de la lecon (pour afficher les bannieres) ──
function loadStatus(){
  fetch(API+'/lesson_status?lesson_key=eq.'+encodeURIComponent(L.lesson_key),{headers:H})
    .then(function(r){return r.json()})
    .then(function(rows){
      if (!rows.length) return;
      var s = rows[0];
      if (s.status === 'needs_recheck') {
        document.getElementById('recheck-banner').innerHTML =
          '<strong>⚠ Cette leçon a été régénérée depuis ta dernière approbation</strong><br>'
          + 'Voiceover régénéré : ' + fmtDate(s.voiceover_uploaded_at) + '<br>'
          + 'Tu l\'avais approuvée : ' + fmtDate(s.latest_review_at) + '<br>'
          + (s.regen_source ? 'Source : ' + s.regen_source : '');
        document.getElementById('recheck-banner').classList.remove('hidden');
      } else if (s.status === 'approved') {
        document.getElementById('approved-banner').innerHTML =
          '<strong>✓ Cette leçon est déjà approuvée</strong><br>'
          + 'Approuvée par ' + (s.latest_reviewer || 'Anonyme') + ' le ' + fmtDate(s.latest_review_at);
        document.getElementById('approved-banner').classList.remove('hidden');
      }
    });
}

// ── Initialisation ───────────────────────────────────────────
resolveLesson(function(lesson){
  if (!lesson) {
    document.body.innerHTML = '<a href="index.html" style="color:#94A3B8">← Retour</a><div class="err">Leçon introuvable.</div>';
    return;
  }
  L = lesson;

  // Titre + navigation
  document.getElementById('title').textContent = L.short_title || L.title;

  var nav = document.getElementById('nav');
  nav.innerHTML = '<a href="course.html?course='+encodeURIComponent(L.course_id)+'">← Cours</a>'
    + '<a href="index.html">Index</a>';

  // Audio
  au = new Audio(STORAGE + '/' + L.lesson_key + '/voiceover.mp3');
  au.onplay = function(){document.getElementById('bp').textContent='\u23f8';requestAnimationFrame(sync)};
  au.onpause = function(){document.getElementById('bp').textContent='\u25b6'};
  au.onended = function(){document.getElementById('bp').textContent='\u25b6'};
  au.onseeked = function(){var t=au.currentTime;for(var i=0;i<els.length;i++){if(W[i].start>t){els[i].classList.remove('spoken');els[i].classList.remove('now')}else{els[i].classList.add('spoken')}}prevIdx=-1;sync()};

  // Timestamps
  fetch(STORAGE + '/' + L.lesson_key + '/timestamps.json')
    .then(function(r){return r.json()})
    .then(function(d){
      W = d;
      buildWords();
      loadExistingReview();
    }).catch(function(err){
      // Fallback : l'ancien nom de fichier etait voiceover-timestamps.json
      return fetch(STORAGE + '/' + L.lesson_key + '/voiceover-timestamps.json')
        .then(function(r){return r.json()})
        .then(function(d){W=d; buildWords(); loadExistingReview();});
    }).catch(function(err){
      document.getElementById('wc').innerHTML = '<div class="err">Impossible de charger les timestamps: '+err.message+'</div>';
    });

  loadStatus();
});

function buildWords(){
  var c=document.getElementById('wc');c.innerHTML='';
  var ls=-1;
  for(var i=0;i<W.length;i++){
    var w=W[i];
    var si=w.sentenceIndex!=null?w.sentenceIndex:-1;
    if(si!==ls&&si>=0){var m=document.createElement('span');m.className='sm';m.textContent='['+si+']';c.appendChild(m);ls=si}
    var s=document.createElement('span');s.className='w';s.textContent=w.word;
    (function(ii,sp){
      sp.onclick=function(){
        if(sp.classList.contains('flagged')){sp.classList.remove('flagged');flags.delete(ii)}
        else{sp.classList.add('flagged');flags.set(ii,{index:ii,word:W[ii].word,context:getCtx(ii),time:fmt(W[ii].start),sentenceIndex:gsi(ii),note:''})}
        renderFlags()};
      sp.ondblclick=function(){au.currentTime=Math.max(0,W[ii].start-0.15);if(au.paused)au.play()};
    })(i,s);
    c.appendChild(s);c.appendChild(document.createTextNode(' '));els.push(s);
  }
}

function flagStutter(){var t=au.currentTime;var i=0;for(var j=0;j<W.length;j++){if(W[j].start<=t)i=j}
  glitches.unshift({time:fmt(t),timeSec:t,context:getCtx(i),sentenceIndex:gsi(i),note:''});
  var b=document.getElementById('stb');b.classList.add('flash');b.textContent='\u2713';
  setTimeout(function(){b.classList.remove('flash');b.textContent='\u26a1 Stutter'},700);renderGlitches()}

function hl(ctx){return (ctx||'').replace(/\*\*(.+?)\*\*/g,'<b style="color:#E74C3C">$1</b>')}

function renderGlitches(){var l=document.getElementById('gl');
  if(!glitches.length){l.innerHTML='<div class="empty">Appuie \u26a1 Stutter pendant l\'écoute</div>';return}
  l.innerHTML='';for(var gi=0;gi<glitches.length;gi++){(function(g,ii){var d=document.createElement('div');d.className='ri g';
    d.innerHTML='<span class="rt" onclick="jmp('+g.timeSec+')">'+g.time+'</span><span class="rs">#'+g.sentenceIndex+'</span><span class="rc">'+hl(g.context)+'</span><input placeholder="Note" value="'+(g.note||'').replace(/"/g,'&quot;')+'" oninput="glitches['+ii+'].note=this.value"><button class="rm" onclick="glitches.splice('+ii+',1);renderGlitches()">\u2715</button>';
    l.appendChild(d)})(glitches[gi],gi)}}

function renderFlags(){var l=document.getElementById('fl');
  if(!flags.size){l.innerHTML='<div class="empty">Clique sur les mots qui sonnent mal</div>';return}
  l.innerHTML='';var sorted=Array.from(flags.entries()).sort(function(a,b){return a[0]-b[0]});
  for(var k=0;k<sorted.length;k++){(function(ii,d){var el=document.createElement('div');el.className='ri f';
    el.innerHTML='<span class="rt" onclick="jmp('+(W[ii]?W[ii].start:0)+')">'+d.time+'</span><span class="rs">#'+(d.sentenceIndex!=null?d.sentenceIndex:'?')+'</span><span class="rw">'+d.word+'</span><span class="rc">'+hl(d.context)+'</span><input placeholder="Note" value="'+(d.note||'').replace(/"/g,'&quot;')+'" oninput="flags.get('+ii+').note=this.value"><button class="rm" onclick="flags.delete('+ii+');if(els['+ii+'])els['+ii+'].classList.remove(\'flagged\');renderFlags()">\u2715</button>';
    l.appendChild(el)})(sorted[k][0],sorted[k][1])}}

function jmp(t){au.currentTime=Math.max(0,t-0.5);if(au.paused)au.play()}

function saveReview(approved){
  var rn = (localStorage.getItem('rn') || 'Anonyme').trim();
  var lessonId = L.lesson_key.split('/').slice(1).join('/');  // legacy : module/slug
  fetch(API+'/voice_reviews?on_conflict=lesson_key,reviewer_name',{
    method:'POST',
    headers:Object.assign({},H,{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({
      lesson_key: L.lesson_key,
      course_id: L.course_id,
      lesson_id: lessonId,
      lesson_title: L.short_title ? '['+L.course_id+'] '+L.short_title : L.title,
      reviewer_name: rn,
      flags: Array.from(flags.values()),
      glitches: glitches,
      approved: !!approved,
      updated_at: new Date().toISOString()
    })
  }).then(function(r){
    showMsg(r.ok ? (approved ? '\u2713 Approuvé!' : 'Sauvegardé!') : 'Erreur '+r.status);
  });
}

function copyReview(){var t='Leçon: '+(L.short_title||L.title)+'\n';
  if(glitches.length){t+='\nStutters:\n';for(var i=0;i<glitches.length;i++){var g=glitches[i];t+='- ['+g.time+'] #'+g.sentenceIndex+' "'+((g.context||'').replace(/\*\*/g,''))+'"';if(g.note)t+=' \u2192 '+g.note;t+='\n'}}
  var sf=Array.from(flags.values()).sort(function(a,b){return a.index-b.index});
  if(sf.length){t+='\nMots:\n';for(var j=0;j<sf.length;j++){var f=sf[j];t+='- ['+f.time+'] #'+f.sentenceIndex+' "'+((f.context||'').replace(/\*\*/g,''))+'"';if(f.note)t+=' \u2192 '+f.note;t+='\n'}}
  navigator.clipboard.writeText(t);showMsg('Copié!')}

function showMsg(t){var m=document.getElementById('msg');m.textContent=t;setTimeout(function(){m.textContent=''},2000)}

// Audio sync (pendant lecture)
function sync(){var t=au.currentTime;var ii=-1,lo=0,hi=W.length-1;
  while(lo<=hi){var m=(lo+hi)>>1;if(t>=W[m].start){ii=m;lo=m+1}else{hi=m-1}}
  if(ii!==prevIdx){if(prevIdx>=0&&els[prevIdx])els[prevIdx].classList.remove('now');
    for(var i=Math.max(0,prevIdx);i<=ii&&i<els.length;i++)els[i].classList.add('spoken');
    if(ii>=0&&els[ii]){els[ii].classList.add('now');els[ii].classList.add('spoken');
      var r=els[ii].getBoundingClientRect(),cr=document.getElementById('wc').getBoundingClientRect();
      if(r.bottom>cr.bottom-20||r.top<cr.top+20)els[ii].scrollIntoView({behavior:'smooth',block:'center'})}
    prevIdx=ii}
  var d=au.duration||0;document.getElementById('pfill').style.width=d?(t/d*100)+'%':'0%';
  document.getElementById('ti').textContent=fmt(t)+' / '+fmt(d);
  if(!au.paused)requestAnimationFrame(sync)}

function tg(){if(!au)return;if(au.paused)au.play();else au.pause()}
function seek(e){if(!au)return;var b=document.getElementById('pbar');var go=function(ev){var r=b.getBoundingClientRect();au.currentTime=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*(au.duration||0)};
  go(e);var mv=function(ev){go(ev)};var up=function(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)}
function setSpd(s,b){if(!au)return;au.playbackRate=s;var btns=document.querySelectorAll('.spd');for(var i=0;i<btns.length;i++)btns[i].classList.remove('on');b.classList.add('on')}
</script>
</body></html>
