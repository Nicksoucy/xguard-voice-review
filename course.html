<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Review</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0A0E1A;color:#F0F0F0;padding:20px 24px;min-height:100vh;max-width:820px;margin:0 auto}
h1{color:#E74C3C;font-size:18px;margin-bottom:4px}
.sub{color:#94A3B8;font-size:12px;margin-bottom:16px}
.back{color:#94A3B8;font-size:12px;text-decoration:none;display:inline-block;margin-bottom:14px;padding:5px 12px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}
.back:hover{background:rgba(255,255,255,0.12);color:#fff}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.f-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94A3B8;font-size:11px;padding:5px 11px;border-radius:4px;cursor:pointer;font-family:inherit}
.f-btn:hover{background:rgba(255,255,255,0.12);color:#fff}
.f-btn.on{background:#C0392B;border-color:#C0392B;color:#fff}

.mod-header{color:#E74C3C;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 6px 0;padding-left:4px}
.mod-header:first-child{margin-top:0}

.list{display:flex;flex-direction:column;gap:5px}
a{text-decoration:none}
.item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:all .15s;font-size:13px}
.item:hover{background:rgba(255,255,255,0.08);border-color:rgba(231,76,60,0.3)}
.item .n{color:#C0392B;font-weight:700;min-width:22px;font-size:12px}
.item .t{color:#F0F0F0;flex:1}
.item .meta-r{display:flex;gap:5px;align-items:center}
.tag-flags{background:rgba(243,156,18,0.15);color:#F39C12;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600}
.tag-reviewer{background:rgba(255,255,255,0.06);color:#94A3B8;font-size:10px;padding:2px 7px;border-radius:3px}
.badge{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.3px}
.b-approved{background:rgba(39,174,96,0.15);color:#2ECC71}
.b-recheck{background:rgba(231,76,60,0.2);color:#F8CACE;border:1px solid rgba(231,76,60,0.5)}
.b-flagged{background:rgba(243,156,18,0.15);color:#F39C12}
.b-progress{background:rgba(59,130,246,0.15);color:#3B82F6}
.b-todo{background:rgba(100,116,139,0.15);color:#94A3B8}
.item .arrow{color:#555;font-size:14px}

.item.hidden{display:none}
.skeleton{background:rgba(255,255,255,0.04);height:42px;border-radius:6px;margin-bottom:5px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.err{color:#E74C3C;padding:20px;background:rgba(231,76,60,0.08);border-left:3px solid #E74C3C;border-radius:0 8px 8px 0;font-size:13px}
</style></head><body>
<a href="index.html" class="back">← Retour aux formations</a>
<h1 id="title">Chargement...</h1>
<p class="sub" id="sub"></p>

<div class="filters" id="filters" style="display:none">
  <button class="f-btn on" data-filter="all">Tout</button>
  <button class="f-btn" data-filter="not_reviewed">À faire</button>
  <button class="f-btn" data-filter="in_review">En cours</button>
  <button class="f-btn" data-filter="flagged">⚠ Flaggées</button>
  <button class="f-btn" data-filter="approved">✓ Approuvées</button>
  <button class="f-btn" data-filter="needs_recheck">↻ À revoir</button>
</div>

<div class="list" id="list">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<script>
var SUPA_URL = 'https://ctjsdpfegpsfpwjgusyi.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0anNkcGZlZ3BzZnB3amd1c3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDU2NDQsImV4cCI6MjA4OTE4MTY0NH0.Uv2pbxbmvcbXhyDa7Y_M0HqkLuV7uJaNxl1N01q5wMo';
var API = SUPA_URL + '/rest/v1';
var H = {apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};

var params = new URLSearchParams(location.search);
var courseParam = params.get('course') || '';

// Compat retro : accepter ?course=0..3 (index numerique)
function resolveCourseId(cb){
  if (/^\d+$/.test(courseParam)) {
    fetch(API+'/courses?visible=eq.true&order=sort_order.asc',{headers:H})
      .then(function(r){return r.json()})
      .then(function(rows){
        var idx = parseInt(courseParam,10);
        if (idx >= 0 && idx < rows.length) cb(rows[idx].id);
        else cb(null);
      });
  } else {
    cb(courseParam);
  }
}

function badgeClass(s){
  return ({approved:'b-approved',needs_recheck:'b-recheck',flagged:'b-flagged',in_review:'b-progress',not_reviewed:'b-todo'})[s] || 'b-todo';
}
function badgeText(s){
  return ({approved:'✓',needs_recheck:'↻ À REVOIR',flagged:'⚠',in_review:'...',not_reviewed:'--'})[s] || '--';
}

resolveCourseId(function(courseId){
  if (!courseId) { document.body.innerHTML = '<div class="err">Cours introuvable.</div>'; return; }

  Promise.all([
    fetch(API+'/courses?id=eq.'+encodeURIComponent(courseId),{headers:H}).then(function(r){return r.json()}),
    fetch(API+'/lesson_status?course_id=eq.'+encodeURIComponent(courseId)+'&order=sort_order.asc',{headers:H}).then(function(r){return r.json()})
  ]).then(function(results){
    var courseRows = results[0];
    var lessonStatuses = results[1];

    if (!courseRows.length) { document.body.innerHTML = '<a href="index.html" class="back">← Retour</a><div class="err">Cours introuvable.</div>'; return; }
    var c = courseRows[0];
    document.getElementById('title').textContent = c.title;
    document.getElementById('sub').textContent = (c.duration_minutes/60).toFixed(c.duration_minutes%60===0?0:1) + ' h — ' + c.lesson_count + ' leçons — ' + c.module_count + ' modules';
    document.getElementById('filters').style.display = 'flex';

    // Grouper par module
    var byModule = {};
    lessonStatuses.forEach(function(l){
      if (!byModule[l.module_id]) byModule[l.module_id] = {index: l.module_index, lessons: []};
      byModule[l.module_id].lessons.push(l);
    });

    var list = document.getElementById('list');
    list.innerHTML = '';

    var modIds = Object.keys(byModule).sort(function(a,b){return byModule[a].index - byModule[b].index});
    modIds.forEach(function(modId){
      var mod = byModule[modId];
      var header = document.createElement('div');
      header.className = 'mod-header';
      header.textContent = 'Module ' + mod.index;
      list.appendChild(header);

      mod.lessons.forEach(function(l){
        var a = document.createElement('a');
        a.href = 'review.html?key=' + encodeURIComponent(l.lesson_key);
        var metaR = '';
        if (l.flags_count > 0) metaR += '<span class="tag-flags">'+l.flags_count+' flags</span>';
        if (l.latest_reviewer) metaR += '<span class="tag-reviewer">'+l.latest_reviewer+'</span>';
        metaR += '<span class="badge '+badgeClass(l.status)+'">'+badgeText(l.status)+'</span>';

        a.innerHTML = '<div class="item" data-status="'+l.status+'">'
          + '<span class="n">'+l.lesson_index+'</span>'
          + '<span class="t">'+(l.short_title || l.title)+'</span>'
          + '<span class="meta-r">'+metaR+'</span>'
          + '<span class="arrow">→</span>'
        + '</div>';
        list.appendChild(a);
      });
    });

    // Filtres
    document.querySelectorAll('.f-btn').forEach(function(btn){
      btn.onclick = function(){
        document.querySelectorAll('.f-btn').forEach(function(b){b.classList.remove('on')});
        btn.classList.add('on');
        var filter = btn.getAttribute('data-filter');
        document.querySelectorAll('.item').forEach(function(it){
          if (filter === 'all' || it.getAttribute('data-status') === filter) it.classList.remove('hidden');
          else it.classList.add('hidden');
        });
      };
    });
  }).catch(function(err){
    document.getElementById('list').innerHTML = '<div class="err">Erreur: '+err.message+'</div>';
    console.error(err);
  });
});
</script>
</body></html>
